# Load generator: five fortio pods hammering the app Service. keepalive=false
# so every request opens a new connection and the Service spreads them across
# all pods; with keep-alive two pods take all the load and the HPA average
# never crosses the target.
# Not in gitops/ on purpose -- it is a stage prop, not part of the platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: jakarta
spec:
  replicas: 5
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:1.69.5
          args: ["load", "-c", "32", "-qps", "0", "-t", "0", "-keepalive=false", "-quiet", "http://jakarta-votes.jakarta.svc.cluster.local/api/items"]
          resources:
            requests: {cpu: 100m, memory: 32Mi}
