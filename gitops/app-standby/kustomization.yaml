# The standby's copy of the app: identical to gitops/app, except the Service
# is ClusterIP behind ingress-nginx (which holds the Civo reserved IP), so the
# QR code in the deck keeps working however often the standby is rebuilt.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app
patches:
  - target: {kind: Service, name: jakarta-votes}
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP
