apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: standby-ingress
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/dmajrekar/civo-kcd-indonesia-2026
    targetRevision: main
    path: gitops/standby-ingress
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # The ClusterIssuer CRD arrives with cert-manager; keep retrying until it does.
    retry:
      limit: 20
      backoff: {duration: 15s, factor: 2, maxDuration: 2m}
