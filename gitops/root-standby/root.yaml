# Everything the live root has. gitops/root is a plain directory and kustomize
# cannot include files outside its own tree, so it is pulled in as one more
# Application rather than copied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dmajrekar/civo-kcd-indonesia-2026
    targetRevision: main
    path: gitops/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
