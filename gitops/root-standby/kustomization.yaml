# The standby cluster's root: everything the live root has, plus the slide
# deck. Same Application names as gitops/root, so switching a cluster's root
# path between the two never prunes anything.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../root
  - slides.yaml
patches:
  # Same Application name, so no prune; only the source path differs.
  - target: {kind: Application, name: jakarta-votes}
    patch: |
      - op: replace
        path: /spec/source/path
        value: gitops/app-standby
