apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakarta-votes
  namespace: jakarta
  labels: {app: jakarta-votes}
spec:
  # No `replicas` here on purpose: the HorizontalPodAutoscaler owns it.
  selector:
    matchLabels: {app: jakarta-votes}
  template:
    metadata:
      labels: {app: jakarta-votes}
    spec:
      containers:
        - name: app
          image: ghcr.io/dmajrekar/jakarta-votes:v2.1
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: TITLE,       value: "Halo Bandung! Shipped from git to JKT1 — keep voting"}
            - {name: THEME_COLOR, value: "#FF4D4D"}
            - {name: REDIS_ADDR,  value: "valkey.jakarta.svc.cluster.local:6379"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 500m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
