apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jakarta-votes
  namespace: jakarta
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: jakarta-votes}
  minReplicas: 2
  maxReplicas: 20   # 20 x 500m CPU does not fit on two nodes -> cluster autoscaler
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 8, periodSeconds: 15}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
