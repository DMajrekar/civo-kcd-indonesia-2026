apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jakarta-votes
  namespace: jakarta
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: jakarta-votes}
  minReplicas: 2
  maxReplicas: 20   # 20 x 250m CPU does not fit on two small nodes -> cluster autoscaler
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
