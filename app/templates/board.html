<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · {{.Title}}</title>
<style>
  :root { --c: {{.Color}}; --cloud: #D1CCBE; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hanken Grotesk", -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background: #000; color: #fff; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; letter-spacing: -.01em; }
  header { padding: 26px 40px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; border-bottom: 1px solid #1a1a1a; }
  header .brand { display: flex; align-items: center; gap: 14px; color: var(--cloud); font-size: 1.1rem; margin-bottom: 14px; }
  header .brand svg { height: 34px; width: auto; }
  header h1 { margin: 0; font-size: 2.3rem; font-weight: 600; line-height: 1.15; }
  header .url { font-size: 1.6rem; font-weight: 600; color: var(--c); white-space: nowrap; margin-bottom: 6px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 40px; padding: 26px 40px; overflow: hidden; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
  li { display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: 14px; font-size: 1.55rem; padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
  li::before { counter-increment: n; content: counter(n); color: #666; font-size: 1.1rem; }
  li .bar { height: 10px; background: var(--c); border-radius: 5px; margin-top: 6px; transition: width .6s; }
  li .n { font-weight: 700; font-size: 1.9rem; font-variant-numeric: tabular-nums; min-width: 3.5rem; text-align: right; color: var(--c); }
  aside { text-align: center; }
  aside img { width: 340px; height: 340px; background: #fff; border-radius: 16px; padding: 10px; }
  aside p { font-size: 1.3rem; margin: 12px 0 0; color: var(--cloud); }
  footer { padding: 14px 40px; font-size: 1.05rem; color: #8a8a8a; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; }
  footer code { color: var(--cloud); }
  .pods { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pods span { background: #111; border: 1px solid #1f1f1f; border-radius: 6px; padding: 2px 8px; font-family: ui-monospace, monospace; font-size: .9rem; color: var(--cloud); }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">{{template "logo"}} <span>Indonesia · JKT1 · KCD Indonesia 2026</span></div>
    <h1>{{.Title}}</h1>
  </div>
  <div class="url">{{.PublicURL}}</div>
</header>
<main>
  <ol id="list"></ol>
  <aside>
    <img src="/qr.png" alt="QR code">
    <p>Scan to vote</p>
  </aside>
</main>
<footer>
  <div>total votes <code id="total">0</code> · <code id="ver">{{.Version}}</code> · store <code>{{.Store}}</code> · pods serving this page:</div>
  <div class="pods" id="pods"></div>
</footer>
<script>
  const list = document.getElementById('list'), pods = document.getElementById('pods');
  const seen = new Map(); // pod -> last seen ms
  function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  async function refresh() {
    try {
      const r = await fetch('/api/items', {cache: 'no-store'});
      const d = await r.json();
      const top = d.items.slice(0, 10), max = Math.max(1, ...top.map(i => i.votes));
      list.innerHTML = top.map(i => `<li><div><div>${esc(i.text)}</div><div class="bar" style="width:${Math.round(100*i.votes/max)}%"></div></div><div class="n">${i.votes}</div></li>`).join('');
      total.textContent = d.items.reduce((a, i) => a + i.votes, 0);
      ver.textContent = d.version;
      seen.set(d.pod, Date.now());
      const now = Date.now();
      pods.innerHTML = [...seen].filter(([, t]) => now - t < 20000).map(([p]) => `<span>${esc(p)}</span>`).join('');
    } catch (e) {}
  }
  refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
